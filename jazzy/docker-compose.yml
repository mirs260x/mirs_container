name: mirs260x-jazzy

services:
  ros:
    build:
      context: .
      network: host
      args:
        MIRS_UID: ${MIRS_UID:-1000}
        MIRS_GID: ${MIRS_GID:-1000}
    container_name: mirs260x-jazzy
    privileged: true
    network_mode: host
    ipc: host
    pid: host

    environment:
      - DISPLAY=${DISPLAY}
      #- XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=90

    volumes:
      - type: bind
        # Compose resolves relative bind paths from this file's directory.
        # Override with MIRS_WORKSPACE when using a workspace elsewhere.
        source: ${MIRS_WORKSPACE:-../..}
        target: "/home/developer/ws"
      - type: bind
        source: "/tmp/.X11-unix"
        target: "/tmp/.X11-unix"

    devices:
      - /dev:/dev

    stdin_open: true
    tty: true
    command: bash
